<!DOCTYPE html>
<html lang=en>
    <head>

    <body>
    <!--Main Navigation Bar-->
    <header>
        <nav id="navbar" aria-label="primary">
            <button class="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="navbar"><span></span><span></span><span></span></button>
               <a href="/" class="navbutton">Home</a>
               <a href="about.html" class="navbutton">About</a>
               <a href="portfolio.html" class="navbutton active">Portfolio</a> <!-- Active class added to stay highlighted-->
               <a href="contact.html" class="navbutton">Contact</a>
            <p class="logo">NASHWA HAMIDO</p>
        </nav>
    </header>
    <!--3D Carousel Container-->
    <div id="carousel-3d-container">
        <div id="carousel-3d">
            <!-- Carousel Images -->
            <div class="carousel-3d-item active">
                <img src="TC_crafting.png" alt="crafting area scene">
            </div>
            <div class="carousel-3d-item">
                <img src="monster2.png" alt="sci-fi monster">
            </div>
            <div class="carousel-3d-item">
                <img src="runnercharacter.jpg" alt="soldier in base">
            </div>
            <div class="carousel-3d-item">
                <img src="monster1.png" alt="sci-fi monster">
            </div>
            <div class="carousel-3d-item">
                <img src="scifi_soldier+monsters.png" alt="sci-fi monsters with soldier">
            </div>
            <div class="carousel-3d-item">
                <img src="crayta_thanksgiving.png" alt="thanksgiving dinner">
            </div>
            <div class="carousel-3d-item">
                <img src="boardgame.png" alt="boardgame scene">
            </div>
            <div class="carousel-3d-item">
                <img src="fooledya.png" alt="giant chess">
            </div>
        </div>

        <!-- Navigation Buttons -->
        <button class="carousel-3d-btn carousel-3d-prev" aria-label="Previous">‹</button>
        <button class="carousel-3d-btn carousel-3d-next" aria-label="Next">›</button>

        <!-- Navigation Dots -->
        <div class="carousel-3d-dots">
            <span class="carousel-3d-dot active" data-index="0"></span>
            <span class="carousel-3d-dot" data-index="1"></span>
            <span class="carousel-3d-dot" data-index="2"></span>
            <span class="carousel-3d-dot" data-index="3"></span>
            <span class="carousel-3d-dot" data-index="4"></span>
            <span class="carousel-3d-dot" data-index="5"></span>
            <span class="carousel-3d-dot" data-index="6"></span>
            <span class="carousel-3d-dot" data-index="7"></span>
        </div>
    </div>
        <!--Portfolio Secondary Buttom Navigation-->
        <nav class="portfoliotabs">
            <a href="portfolio.html" class="portfolionav">Key Art & Branding</a>
            <a href="capturedscenes.html" class="portfolionav active">Captured Scenes</a> <!-- Active class added to stay highlighted-->
            <a href="cinematicsandmotion.html" class="portfolionav">Cinematics & Motion</a>

        </nav>
        <!--Footer, Copyright Line-->
        <footer id="copyright3">
           <p>Copyright &#169; 2025 Nashwa Hamido. All rights reserved.</p>
        </footer>

        <!-- Dark/Light Mode Toggle -->
        <div id="theme-toggle">
            <span class="theme-label dark-label">DARK</span>
            <label class="switch">
                <input type="checkbox" id="theme-checkbox">
                <span class="slider round"></span>
            </label>
            <span class="theme-label light-label">LIGHT</span>
        </div>

        <!-- 3D Carousel Script (also handles the dark/light toggle) -->
        <script src="carousel-3d.js"></script>
        <script src="nav.js"></script>
</body>
</html>
