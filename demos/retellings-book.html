<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>The Places: interactive book (Retellings demo)</title>
    <!-- Book-only demo for the Retellings case study on nashwa.studio.
         Everything (code, styles, 3D model, images) loads from the live
         Retellings site, so this stays in sync with it. -->
    <base href="https://retellings.vercel.app/pages/" target="_blank">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400..800&family=Epilogue:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../app/css/variable.css" />
    <link rel="stylesheet" href="../app/css/global.css" />
    <link rel="stylesheet" href="../app/css/locations.css" />
    <link rel="stylesheet" href="../app/css/book.css" />
    <link rel="stylesheet" href="../app/css/windows.css" />
    <link rel="stylesheet" href="../app/css/deco.css" />
    <link rel="stylesheet" href="../app/css/folio.css" />
    <link rel="stylesheet" href="../app/css/type.css">
    <script type="importmap">
      { "imports": { "three": "../app/js/vendor/three/three.module.min.js" } }
    </script>
    <script type="module" src="../app/js/book3d.js"></script>
    <script src="../app/js/locations-data.js" defer></script>
    <script src="../app/js/book-text.js" defer></script>
    <script src="../app/js/tour-data.js" defer></script>
    <script src="../app/js/tour-store.js" defer></script>
    <script src="../app/js/loc-windows.js" defer></script>
    <script src="../app/js/sources-data.js" defer></script>
    <script src="../app/js/sources.js" defer></script>
    <script src="../app/js/vendor/page-flip.browser.js" defer></script>
    <script src="../app/js/book.js" defer></script>
    <style>
      html, body { min-height: 100%; }
      body { margin: 0; }
      .demo-main { padding: 1rem 0 1.5rem; }
      .demo-main .book-stage { margin-top: 0; }
    </style>
  </head>
  <body>
    <script>document.body.classList.add("dark")</script>
    <main id="content" class="demo-main">
      <section aria-label="Dubliners: the interactive book">
        <!-- Flip-book (hidden in plain-text mode) -->
        <div class="book-stage" id="book-stage">
          <!-- 3D book object: click to open to the flat reading view -->
          <button type="button" class="book-hero" id="book-hero" aria-label="View the book">
            <div class="book3d-mount" id="book3d-mount">
              <img class="book3d-img" src="assets/book-3d.svg" alt="" aria-hidden="true" width="640" height="440">
            </div>
          </button>

          <div class="book-viewport">
            <div class="book-case" id="book-case">
              <div id="flipbook"></div>
            </div>
          </div>
        </div>

        <!-- Accessible plain-reading fallback (built by book.js) -->
        <article class="book-plain" id="book-plain" aria-label="Dubliners retellings, plain text" hidden></article>

        <!-- Controls (always visible, so you can switch back from plain mode) -->
        <div class="book-controls is-closed" id="book-controls">
          <button type="button" class="book-btn" id="book-prev" aria-label="Previous page">&lsaquo; Previous</button>
          <button type="button" class="book-btn" id="book-contents">Contents</button>
          <span class="book-progress" id="book-progress" aria-live="polite" role="status"></span>
          <button type="button" class="book-btn" id="book-next" aria-label="Next page">Next &rsaquo;</button>
          <button type="button" class="book-btn book-toggle" id="book-toggle" aria-pressed="false">View the book</button>
          <div class="book-jump">
            <label for="book-chapter" class="book-jump-label">Chapter</label>
            <select id="book-chapter" class="book-select" aria-label="Jump to chapter"></select>
          </div>
          <button type="button" class="book-btn" id="book-mode" aria-pressed="false">Read as plain text</button>
        </div>
      </section>
    </main>
    <div class="window-layer" id="window-layer"></div>
  </body>
</html>
